name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.*

      - name: Restore
        run: dotnet restore DevEnvManager/DevEnvManager.csproj

      - name: Build
        run: dotnet build DevEnvManager/DevEnvManager.csproj -c Release --no-restore

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish DevEnvManager/DevEnvManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Copy config
        run: Copy-Item -Path DevEnvManager/config/tools.json -Destination publish/${{ matrix.rid }}/config/tools.json -Force

      - name: Build MSI installer
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.rid }}' -eq 'win-x64') { 'x64' } else { 'arm64' }
          $ver = if ('${{ env.VERSION }}' -ne '0.0.0') { '${{ env.VERSION }}'.TrimStart('v') } else { '0.1.0' }
          Copy-Item installer/Product.wxs publish/${{ matrix.rid }}/Product.wxs
          (Get-Content publish/${{ matrix.rid }}/Product.wxs) -replace 'Version="0.1.0"', "Version=`"$ver`"" | Set-Content publish/${{ matrix.rid }}/Product.wxs
          Push-Location publish/${{ matrix.rid }}
          wix build Product.wxs -arch $arch -out ../DevEnvManager-${{ matrix.rid }}.msi
          Pop-Location

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: DevEnvManager-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 30

      - name: Upload artifact (msi)
        uses: actions/upload-artifact@v4
        with:
          name: DevEnvManager-${{ matrix.rid }}-msi
          path: publish/DevEnvManager-${{ matrix.rid }}.msi
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*-msi/*.msi
