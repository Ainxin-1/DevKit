name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DevEnvManager/DevEnvManager.csproj

      - name: Build
        run: dotnet build DevEnvManager/DevEnvManager.csproj -c Release --no-restore

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish DevEnvManager/DevEnvManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Copy config
        run: Copy-Item -Path DevEnvManager/config/tools.json -Destination publish/${{ matrix.rid }}/config/tools.json -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevEnvManager-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zips
        run: |
          cd artifacts
          for dir in */; do
            name=$(basename "$dir")
            zip -r "${name}.zip" "$dir"
          done
          ls -la *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
